<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buffer Problem Detector</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Buffer problem detector</h1>
<p class="sub">Sellers add stock to a warehouse, buyers take it out. Enter the numbers and see whether overflow, underflow or a race condition happens, and why.</p>

<div class="grid">
<div>
 <div class="card">
  <h2>Inputs</h2>
  <label for="cap">Warehouse capacity</label><input type="number" id="cap" min="1" max="20" value="5">
  <label for="stock">Starting stock</label><input type="number" id="stock" min="0" max="20" value="1">
  <label for="ns">Number of sellers</label><input type="number" id="ns" min="0" max="10" value="0">
  <label for="ps">Products each seller ships</label><input type="number" id="ps" min="0" max="10" value="0">
  <label for="nb">Number of buyers</label><input type="number" id="nb" min="0" max="10" value="2">
  <label for="pb">Items each buyer buys</label><input type="number" id="pb" min="0" max="10" value="1">
  <label>Protection level</label>
  <div class="prot">
   <label><input type="radio" name="prot" value="1" checked><span><b>1 None.</b> No checks, no lock.</span></label>
   <label><input type="radio" name="prot" value="2"><span><b>2 Checks only.</b> Look before acting, but everyone acts at once.</span></label>
   <label><input type="radio" name="prot" value="3"><span><b>3 Full.</b> Checks plus a lock, one at a time.</span></label>
  </div>
  <button class="primary" id="run">Run simulation</button>
  <p class="hint" id="err" role="alert"></p>
 </div>
</div>

<div>
 <div class="card">
  <div class="wh">
   <div><div class="num big" id="stk">1</div><div class="hint">in stock</div></div>
   <div class="shelf" id="shelf"></div>
  </div>
 </div>
 <div class="card"><h2>What happened</h2><ul id="tl"><li class="ref">Press Run simulation.</li></ul></div>
 <div class="card" id="res" hidden>
  <h2>Result</h2>
  <div class="nums" id="nums"></div>
  <div id="verdicts"></div>
 </div>
</div>
</div>

<div class="card">
 <h2>Ready-made examples</h2>
 <div class="ex" id="ex"></div>
 <div class="row" style="margin-top:12px"><button id="verify">Verify all examples</button></div>
 <div class="scroll" id="vt"></div>
</div>
</main>
<script src="script.js"></script>
</body>
</html>
